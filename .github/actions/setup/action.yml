name: Setup
description: Install mise and the project's Poetry dependencies.

# The caller checks out first: a local action is read from the checked-out
# tree, and each job sets its own checkout options.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5
      with:
        # mise.toml includes its tasks from a git:: source, still experimental
        experimental: true
    - run: mise exec -- poetry install
      shell: bash
