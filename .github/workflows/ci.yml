name: CI

# Third-party actions are pinned to a commit, so a moving tag cannot change
# what runs here. The trailing comment is the tag that commit was.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - run: mise exec -- poetry install
      - run: mise run test:py:cov
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true
      - name: Upload client coverage to Codecov
        uses: codecov/codecov-action@v7
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-client/lcov.info
          flags: client
          disable_search: true

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - run: mise exec -- poetry install
      - run: mise run lint:py

  # advisory: reports the branch's debt without blocking the merge
  tingle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tingle check needs history to find the merge-base
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - run: mise exec -- poetry install
      - run: mise exec -- poetry run tingle check
