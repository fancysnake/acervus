[settings]
# Sequential execution to avoid race conditions in parallel tests
jobs = 1

[tools]
python = "3.14"
poetry = { version = "2.3.2", pyproject = "{{ config_root }}/pyproject.toml" }

[env]
# Mise creates and activates this virtualenv automatically
_.python.venv = { path = ".venv", create = true }
PACKAGE = "acervus"
SRC_PATHS = "src"
TEST_PATHS = "tests"
SCRIPT_PATHS = ""
TOML_PATHS = ".taplo.toml pyproject.toml mise.toml tingle.toml"

[task_config]
includes = ["git::https://github.com/fancysnake/shared-configs.git//python.toml"]

[tasks.update]
run = [{ task = "dep:upgrade:py" }]

[tasks.fullcheck]
run = [
    "poetry install",
    { task = "format:py" },
    { task = "lint:py" },
    { task = "test:py:cov:diff" },
    { task = "lint:tingle" },
]
