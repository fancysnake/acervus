[settings]
# Sequential execution to avoid race conditions in parallel tests
jobs = 1

[hooks]
enter = "poetry install"

[tools]
"pipx:poetry" = { version = "2.5.1", pyproject = "/home/radek/acervus/pyproject.toml" }
pipx = "1.17.6"
python = "3.14.7"

[env]
# Mise creates and activates this virtualenv automatically
_.python.venv = { path = ".venv", create = true }
PACKAGE = "acervus"
SRC_PATHS = "src"
TEST_PATHS = "tests"
SCRIPT_PATHS = ""
TOML_PATHS = ".taplo.toml pyproject.toml mise.toml tingle.toml"

[task_config]
includes = ["git::https://github.com/fancysnake/shared-configs.git//python.toml"]

[tasks.update]
run = [
    "mise upgrade --bump --exclude python --minimum-release-age=7d",
    { task = "dep:upgrade:py" },
]

[tasks."docs:serve"]
description = "Serve the manual at http://127.0.0.1:8000 with live reload"
run = "poetry run mkdocs serve"

[tasks."docs:build"]
description = "Build the manual into site/, failing on a broken link"
run = "poetry run mkdocs build --strict"

[tasks."test:mutation"]
description = "Run mutation tests; fails on any surviving or untested mutant"
# NOTE: mutmut reuses mutants/ between runs: its stats only re-collect for new
# tests, so a function added since the last run maps to no test, and the
# "no tests" verdict that writes into the .meta files is never reset by a later
# run. Starting from an empty mutants/ makes every run a full one, as in CI;
# "no tests" is gated like a survivor so a stale verdict cannot pass either.
run = [
    "rm -rf mutants",
    "mutmut run",
    "mutmut results",
    "! mutmut results | grep -E ': (survived|no tests)$'",
]

[tasks.fullcheck]
run = [
    "poetry install",
    { task = "format:py" },
    { task = "lint:py" },
    { task = "test:py:cov:diff" },
    { task = "lint:tingle" },
]
