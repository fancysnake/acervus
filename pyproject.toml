[project]
name = "acervus"
version = "0.1.0"
description = "Filesystem tagging tool"
authors = [{ name = "Radosław Ganczarek", email = "radoslaw@ganczarek.in" }]
license = { text = "BSD-3-Clause license" }
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy[mypy] (>=2.0.48,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "textual (>=8.2.8,<9.0.0)",
]

[project.scripts]
acre = "acervus.inits.wiring:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "codespell (>=2.4.2,<3.0.0)",
    "deptry (>=0.25.1,<0.26.0)",
    "diff-cover (>=10.2.0,<11.0.0)",
    "import-linter (>=2.11,<3.0)",
    "mkdocs (>=1.6,<2.0)",
    "mkdocs-material (>=9.6,<10.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "taplo (>=0.9.3,<0.10.0)",
    "tingle (>=0.7.0,<0.8.0)",
    "vulture (>=2.16,<3.0)",
]

[tool.black]
line-length = 88
preview = true
skip-magic-trailing-comma = true
target-version = ['py314']

# PYTEST

[tool.pytest.ini_options]
asyncio_mode = "auto"

# COVERAGE

[tool.coverage.run]
branch = true
source = ["src", "tests"]
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "# pragma: no cover"]
precision = 2

# DEPTRY

[tool.deptry]
known_first_party = ["acervus"]

[tool.deptry.per_rule_ignores]
DEP002 = []
DEP004 = []

# MYPY

[tool.mypy]
check_untyped_defs = true
color_output = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = ["migrations/.*.py", "tests/.*.py"]
explicit_package_bases = true
extra_checks = true
implicit_reexport = true
mypy_path = "src"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
pretty = true
python_version = "3.14"
strict = true
strict_equality = true
strict_equality_for_none = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["acervus.links.db.sqlalchemy.*"]
disallow_any_expr = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# RUFF

[tool.ruff]
line-length = 88
output-format = 'concise'
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM",
    "CPY", # Missing copyright notice at top of file
    "D1",  #Missing docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "ANN", # flake8-annotations
    "S",   # bandit
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-type = "tuple"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# IMPORT LINTER

[tool.importlinter]
include_external_packages = "True"
root_package = "acervus"

# Explanation <source_modules> can't import <forbidden_modules>

[[tool.importlinter.contracts]]
name = "gates"
type = "forbidden"
source_modules = ["acervus.gates"]
forbidden_modules = [
    "acervus.links",
    "acervus.inits",
    "acervus.mills",
    "acervus.specs",
    "acervus.edges",
]

[[tool.importlinter.contracts]]
name = "links"
type = "forbidden"
source_modules = ["acervus.links"]
forbidden_modules = [
    "acervus.gates",
    "acervus.inits",
    "acervus.mills",
    "acervus.specs",
    "acervus.edges",
]

[[tool.importlinter.contracts]]
name = "inits"
type = "forbidden"
source_modules = ["acervus.inits"]
forbidden_modules = ["acervus.edges"]

# specs is reachable from inits only through mills: wiring a service that
# validates through specs makes the chain reachable, but no module in inits
# may name a specs module itself. allow_indirect_imports says exactly that.
[[tool.importlinter.contracts]]
name = "inits-specs-only-through-mills"
type = "forbidden"
source_modules = ["acervus.inits"]
forbidden_modules = ["acervus.specs"]
allow_indirect_imports = "True"


[[tool.importlinter.contracts]]
name = "mills"
type = "forbidden"
source_modules = ["acervus.mills"]
forbidden_modules = ["acervus.gates", "acervus.links", "acervus.inits", "acervus.edges"]


[[tool.importlinter.contracts]]
name = "pacts"
type = "forbidden"
source_modules = ["acervus.pacts"]
forbidden_modules = [
    "acervus.gates",
    "acervus.links",
    "acervus.inits",
    "acervus.mills",
    "acervus.specs",
    "acervus.edges",
]


[[tool.importlinter.contracts]]
name = "specs"
type = "forbidden"
source_modules = ["acervus.specs"]
forbidden_modules = [
    "acervus.gates",
    "acervus.links",
    "acervus.inits",
    "acervus.mills",
    "acervus.edges",
]


[[tool.importlinter.contracts]]
name = "edges"
type = "forbidden"
source_modules = ["acervus.edges"]
forbidden_modules = [
    "acervus.gates",
    "acervus.links",
    "acervus.inits",
    "acervus.mills",
    "acervus.pacts",
    "acervus.specs",
]

[[tool.importlinter.contracts]]
name = "inside-gates"
type = "independence"
modules = ["acervus.gates.*"]

[[tool.importlinter.contracts]]
name = "inside-links"
type = "independence"
modules = ["acervus.links.*"]

[[tool.importlinter.contracts]]
name = "inside-mills"
type = "independence"
modules = ["acervus.mills.*"]

[[tool.importlinter.contracts]]
name = "inside-pacts"
type = "independence"
modules = ["acervus.pacts.*"]

[[tool.importlinter.contracts]]
name = "inside-specs"
type = "independence"
modules = ["acervus.specs.*"]

[[tool.importlinter.contracts]]
name = "inside-edges"
type = "independence"
modules = ["acervus.edges.*"]

# Vulture

[tool.vulture]
ignore_names = [
    "on_*",
    "action_*",
    "compose",
    "get_default_screen",
    "cursor_type",
    "display",
    "main",
]
